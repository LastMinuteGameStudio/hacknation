# Praca lokalna bez tunelu: aplikacja tylko na 127.0.0.1, tunel wyłączony.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
  tunnel:
    profiles: ["tunel"]  # nie startuje, dopóki nie podasz --profile tunel
