# Uruchomienie (z katalogu app/):  cp .env.example .env && docker compose up --build
# Ruch przychodzący wyłącznie przez tunel Cloudflare: żaden serwis nie publikuje portów (PLAN.md §3, Wojtek).
# Praca lokalna bez tunelu: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aed
      POSTGRES_PASSWORD: aed
      POSTGRES_DB: aed
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aed"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aed:aed@db:5432/aed
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  tunnel:
    # Tunel nazwany na domenie Wojtka. W dashboardzie Cloudflare: public hostname → http://app:8000.
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      # Bez tokenu tunel się nie połączy: ustaw TUNNEL_TOKEN w app/.env (od Wojtka) albo użyj docker-compose.dev.yml.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
volumes:
  dbdata:
